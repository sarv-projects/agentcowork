<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentCowork — Approval</title>
    <!--
      F1 — the dedicated Guard-2 approval surface. This page is the ONLY
      surface that renders an approval card and the only window guard_respond
      accepts. It intentionally has no React, no vendor bundles, no iframes
      and no external resources: it receives ticket payloads directly from
      Rust via IPC and renders them. Nothing untrusted is ever loaded here.
    -->
    <style>
      :root {
        color-scheme: light;
        --bg: #faf8f3;
        --card: #ffffff;
        --ink: #1f2937;
        --muted: #6b7280;
        --line: #e5e1d8;
        --accent: #b45309;
        --danger: #b91c1c;
        --ok: #047857;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--card);
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 1;
      }
      header h1 { font-size: 14px; font-weight: 600; margin: 0; }
      header .meta { font-size: 12px; color: var(--muted); }
      main { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
      .empty {
        border: 1px dashed var(--line);
        border-radius: 10px;
        padding: 32px 16px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px;
        box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      }
      .card h2 { font-size: 13px; margin: 0 0 4px; font-weight: 600; }
      .card .sub { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
      .risk { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
      .risk.high { background: #fef2f2; color: var(--danger); }
      .risk.medium { background: #fffbeb; color: var(--accent); }
      .risk.low { background: #ecfdf5; color: var(--ok); }
      .risk.unknown { background: #f3f4f6; color: var(--muted); }
      .section { margin-top: 10px; }
      .section .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 4px; }
      pre, .paths, .lines {
        background: #f6f4ee;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px;
        font-size: 11.5px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre-wrap;
        word-break: break-word;
        margin: 0;
        max-height: 180px;
        overflow: auto;
      }
      ul { margin: 0; padding-left: 16px; font-size: 12px; }
      .actions { display: flex; gap: 8px; margin-top: 12px; }
      button {
        flex: 1;
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 8px;
        padding: 9px 12px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      button.approve { background: var(--ok); border-color: var(--ok); color: #fff; }
      button.reject { background: #fff; border-color: var(--danger); color: var(--danger); }
      .foot { font-size: 11px; color: var(--muted); text-align: center; padding: 8px 16px 16px; }
      .note { font-size: 11px; color: var(--muted); background: #fffbeb; border: 1px solid #fde68a; border-radius: 6px; padding: 8px; margin-top: 10px; }
      .error { color: var(--danger); font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>AgentCowork — Approval</h1>
      <span class="meta" id="count">…</span>
    </header>
    <main id="stack"></main>
    <div class="foot">Guard-2 · single-use tickets · approve/reject is audit-logged</div>
    <script type="module" src="/src/guard-main.ts"></script>
  </body>
</html>
