# AgentCowork — nightly E2E + cross-platform full-flow gate (P10.4/P10.5).
#
# Runs every night (UTC) and on manual dispatch:
#   - the full Rust workspace test suite with the long-running perf/stability
#     gates enabled (AGENTCOWORK_LONG_TESTS=1 — legacy EVERYAIOS_LONG_TESTS=1
#     is set alongside until Core lands the DEC-053 env migration: 30-min
#     heap, battery, 4-hr stability, stress benches) — on all 3 desktop
#     platforms,
#   - the P10 E2E suites (journey/memory/browser/office/sub-agent/ACP/MCP)
#     with the office conformance oracle, on Linux,
#   - the coordinator (sidecar) bun test + typecheck (packages vendored
#     in-repo — always runs).
#
# This is the "test full flow on Win11 / macOS ARM / Ubuntu 24.04" mechanism:
# every nightly run executes the same suites on the real CI OSes. Failures
# page the repo via the standard Actions notification path.

name: nightly-e2e

on:
  schedule:
    # 02:00 UTC — after most dev-activity timezones have quieted down.
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # P10.3 long-running gates (30-min heap / battery / 4-hr stability / 100-task
  # stress) are excluded from the fast CI matrix and only run here.
  # Both spellings are set: the current Rust harness reads the legacy name.
  AGENTCOWORK_LONG_TESTS: "1"
  EVERYAIOS_LONG_TESTS: "1"

jobs:
  full-suite:
    name: full suite + long tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Install OpenSSL (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows-static-md
          echo "OPENSSL_DIR=C:\vcpkg\installed\x64-windows-static-md" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV
          $libs = "-Clink-arg=advapi32.lib -Clink-arg=user32.lib -Clink-arg=crypt32.lib -Clink-arg=gdi32.lib"
          echo "RUSTFLAGS=-D warnings $libs" >> $env:GITHUB_ENV

      # Full workspace incl. nightly-gated long tests (P10.3) + the P10 E2E
      # suites (P10.1) + security suites (P10.2).
      - name: cargo test --workspace (all features, long gates on)
        run: cargo test --all-features --workspace -- --test-threads=4

      # WSL/POSIX bridge (P8.6) is pure path/env logic — run it explicitly on
      # every OS, but it is the P10.4 "WSL bridge on Windows" gate on the
      # Windows runner (tests are platform-agnostic; the module's own
      # cfg(windows) branch is exercised there).
      - name: WSL bridge module tests
        run: cargo test -p agentcowork-core wsl

      # Ollama/llamafile local-runtime protocol tests (P10.4: connect/chat on
      # all 3 platforms — mock endpoints, no daemon required).
      - name: Local-runtime (Ollama/llamafile) tests
        run: cargo test -p agentcowork-vault local_

      # SQLCipher vault portable-bytes gate (P10.4: copy vault.db between OS —
      # the file format is portable; this asserts the file is self-contained,
      # encrypted at rest, and reopens with only the key on every OS).
      - name: Vault cross-OS portable-bytes tests
        run: cargo test -p agentcowork-vault portable

  office-oracle:
    name: office oracle + E2E (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Install LibreOffice (writer + calc + impress)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer libreoffice-calc libreoffice-impress

      - name: LibreOffice conformance oracle
        run: >-
          cargo test -p agentcowork-office --lib
          conformance::tests::live_oracle_opens_clean
          -- --ignored --test-threads=1
        env:
          AGENTCOWORK_LIVE_TEST: "1"
          EVERYAIOS_LIVE_TEST: "1"

      - name: P10 E2E suites
        run: cargo test --workspace --test p10_e2e --test p10_pipeline -- --test-threads=4
        env:
          AGENTCOWORK_LIVE_TEST: "1"
          EVERYAIOS_LIVE_TEST: "1"

  sidecar:
    name: coordinator bun test + typecheck (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: desktop_app
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install workspace deps
        working-directory: desktop_app
        run: |
          npm install -g pnpm
          pnpm install
      - name: Coordinator typecheck
        working-directory: desktop_app/packages/coordinator
        run: bun run type-check
      - name: Coordinator tests
        working-directory: desktop_app/packages/coordinator
        run: bun test
