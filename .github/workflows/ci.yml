# AgentCowork — Rust workspace CI (P0.1)
# Runs cargo test + clippy + fmt on every push/PR, on all 3 desktop platforms.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Fix 2 — capabilities.yaml == ARCH/09 == spec §0, and TODO.md header counts
  # match the file. Fast (no build); catches index-level drift on every PR.
  docs-sync:
    name: docs-sync (capability index + TODO counts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run doc-sync check
        run: node scripts/check-doc-sync.mjs
      # P70.A7 — one authoritative application version across the installer,
      # the updater manifest, the sidecar handshake and the shell-chrome badge.
      - name: Version lockstep
        run: node scripts/check-versions.mjs
      # P70.A1 — the PUBLISHED bundle matrix is Windows-only `nsis`+`msi` on the
      # two Windows targets. tauri.conf.json keeps all six targets for the local
      # harness, so the assertion lives on the release workflow plus the
      # published support matrix.
      - name: Release matrix (published platform set)
        run: node scripts/check-release-matrix.mjs
      # P70.A4 — installer metadata, icon assets, a pinned MSI upgrade identity,
      # and no OS integration claimed without a handler behind it.
      - name: App metadata + assets
        run: node scripts/check-app-metadata.mjs
      # P70.A3 — every externally spawned program is classified, and no shipping
      # path requires a build toolchain on the user's machine.
      - name: Native dependency audit
        run: node scripts/check-native-deps.mjs
      # P70.A5 — the size/footprint budgets are valid and still cover both
      # published targets (the release job measures against them).
      - name: Size + footprint budgets
        run: node scripts/check-size-budget.mjs
      # P70.A8 — every durable store carries a schema version and a
      # forward-only migration path (the registry, the vault's own constant and
      # the published table must agree).
      - name: Durable store schemas
        run: node scripts/check-store-schemas.mjs
      # P70.B6 — every dependency licence is allow-listed or on a recorded
      # decision, zero copyleft, and the notices file is current.
      - name: Licence compliance
        run: node scripts/check-licences.mjs
      # P70.B4 — updater key custody: private key gitignored, release secrets
      # wired, pubkey trust anchor in agreement.
      - name: Updater key custody
        run: node scripts/check-updater-keys.mjs
      # P70.C7 — updater code, config, docs and store registry agree; the
      # published update contract cannot silently stop describing the binary.
      - name: Update pipeline
        run: node scripts/check-update-pipeline.mjs
      # P70.D — install layout, the recovery playbook, the diagnostics
      # commands and the platform-honesty statements (D1/D4/D5/D6/D7/D8/D9).
      - name: Diagnostics surface
        run: node scripts/check-diagnostics-surface.mjs
      # P70.E — the executable half of the release qualification: kernel gate
      # state, doc gates and the honest-capability audit. The items that need a
      # host, live credentials or a release candidate are reported as BLOCKED
      # with the blocker named (never silently passed).
      - name: Release qualification (executable items)
        run: node scripts/release-qualify.mjs
      # P70.F2 — the winget manifests name the authoritative version.
      # (P70.F3 download-page check retired 2026-09-26: docs/download.md archived.)
      - name: Release surface agreement
        run: node scripts/gen-release-surface.mjs --check
      # P70.F5/F6/F8 + G — legal/policy documents, the telemetry posture and
      # the launch checklist cannot rot away from what ships.
      - name: Public surface + release process
        run: node scripts/check-public-surface.mjs
      # P71.9i — the published tool-affinity block and the shipped prompt
      # string are one contract, in one order, with real newlines.
      - name: Prompt steering agreement
        run: node scripts/check-prompt-steering.mjs
      # P69.E11 — the only mechanical signal that a heading or a claim was
      # silently removed: every section reference, relative link and link
      # anchor must resolve.
      - name: Cross-document references
        run: node scripts/check-doc-refs.mjs
      # P69.E10 — nothing user-visible may say "Session" (ARCH/SESSION.md §2):
      # user-facing words are Chat / Space / Project; internal/API vocabulary
      # must not leak into strings, templates, JSX text or i18n catalogs.
      - name: User-facing vocabulary
        run: node scripts/check-vocabulary.mjs
      # Packaging verification suite: static checks over the shipped surfaces.
      - name: Packaged release verification
        run: node scripts/verify-packaged-e2e.mjs
      # P69.E — structural invariants: no TS credential custody, no second
      # authorization decider, one auth vocabulary, one canonical schema.
      - name: Architecture invariants
        run: node scripts/check-arch-invariants.mjs

  rust:
    name: cargo test/clippy/fmt (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      # SQLCipher (bundled) requires OpenSSL for encryption.
      # Linux: libssl-dev is preinstalled on ubuntu-latest runners.
      # macOS: LibreSSL ships with Xcode CLI tools (already available).
      # Windows: install via vcpkg and set OPENSSL_DIR + link system libs.
      - name: Install OpenSSL (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows-static-md
          echo "OPENSSL_DIR=C:\vcpkg\installed\x64-windows-static-md" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV
          # OpenSSL static needs these Windows system libs at link time
          $libs = "-Clink-arg=advapi32.lib -Clink-arg=user32.lib -Clink-arg=crypt32.lib -Clink-arg=gdi32.lib"
          echo "RUSTFLAGS=-D warnings $libs" >> $env:GITHUB_ENV

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --all-targets
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

  # P4.5 — LibreOffice headless oracle (D6/D7 conformance gate). The office
  # engines' surgical patch must round-trip through a real LibreOffice parse
  # without a repair warning. This is a separate job (LO install is heavy) and
  # runs on ubuntu only — the oracle is deterministic regardless of host.
  office-oracle:
    name: office LibreOffice oracle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Install LibreOffice (writer)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: LibreOffice oracle (docx patch round-trip)
        run: >-
          cargo test -p agentcowork-office --lib
          conformance::tests::live_oracle_opens_clean
          -- --ignored --test-threads=1
        env:
          # New name first; the pre-rename Rust harness still gates on the
          # legacy spelling, so both are set until Core lands DEC-053.
          AGENTCOWORK_LIVE_TEST: "1"
          EVERYAIOS_LIVE_TEST: "1"

  # UI: self-contained (own package-lock.json, no @agentcowork/* deps) — always runs.
  ui:
    name: ui typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        working-directory: ui
        run: npm ci
      - name: Typecheck
        working-directory: ui
        run: npm run type-check
      - name: Build
        working-directory: ui
        run: npm run build
      # P10.5 "vitest": the UI's unit tests (lib/*.test.ts — NPS timing,
      # session recording, stagger) run under bun, which the lockfile pins.
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Unit tests (bun test)
        working-directory: ui
        run: bun test

  # Sidecar: coordinator bun tests + typecheck. The @agentcowork/core-*
  # engine packages are vendored in-repo under packages/core-*, so this job
  # needs no private-repo token and always runs.
  sidecar:
    name: coordinator bun test + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: desktop_app
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install workspace deps
        working-directory: desktop_app
        run: |
          npm install -g pnpm
          pnpm install
      # Fail loudly if the reused @agentcowork/core-* engine packages are not
      # vendored in-repo. This is the explicit replacement for the dropped
      # APP_CLONE_TOKEN gate: building the sidecar must NEVER silently succeed
      # against a missing/typosquatted core dependency when the workspace is
      # incomplete. Each core-* dep below must (a) be declared in the
      # coordinator's package.json and (b) resolve to packages/core-* in this
      # repo — a missing dir or an external "workspace" mapping is a hard fail.
      - name: Verify vendored core-* packages (fail loudly)
        working-directory: desktop_app
        shell: bash
        run: |
          set -euo pipefail
          # The coordinator's @agentcowork/* direct deps (mirrors package.json).
          need=(core-ai core-connectors core-providers core-search)
          err=0
          for p in "${need[@]}"; do
            pkg="packages/$p"
            if [ ! -d "$pkg" ] || [ ! -f "$pkg/package.json" ]; then
              echo "::error::vendored package '$pkg' is MISSING — the coordinator would fail only later, loudly"; err=1
            fi
            if ! grep -q "\"@agentcowork/$p\"" packages/coordinator/package.json; then
              echo "::error::coordinator does not depend on '@agentcowork/$p' but vendored '$pkg' exists — mismatch"; err=1
            fi
          done
          # Belt-and-suspenders: confirm the workspace glob actually resolves them.
          if ! grep -q '"packages/\*"' pnpm-workspace.yaml; then
            echo "::error::pnpm-workspace.yaml no longer globs 'packages/*' — vendored core-* would resolve externally"; err=1
          fi
          if [ "$err" -ne 0 ]; then exit 1; fi
          echo "core-* packages verified vendored in-repo (${#need[@]})"
      # dist/ is gitignored for the vendored engine packages, so a fresh
      # checkout has no .d.ts to resolve — build them before typecheck/tests
      # (mirrors what a local dev flow does).
      - name: Build vendored core-* packages
        working-directory: desktop_app
        run: pnpm --filter './packages/core-*' run build
      # The engine packages' own suites (49 test files across the ten core-*
      # packages) were built here but never *run*, so a regression inside the
      # vendored engine could not fail this workflow. Each package declares
      # `test: vitest run` and vitest is its own devDependency, so no extra
      # install step is needed.
      - name: Vendored core-* tests
        working-directory: desktop_app
        run: pnpm --filter './packages/core-*' run test
      - name: Coordinator typecheck
        working-directory: desktop_app/packages/coordinator
        run: bun run type-check
      - name: Coordinator tests
        working-directory: desktop_app/packages/coordinator
        run: bun test

  # P10.5 — "cargo test + vitest + Tauri build for Win/Mac/Linux": the Tauri
  # shell itself must type-check on all 3 platforms, not just at release time.
  # cargo check is the fast gate; the release workflow does the full signed
  # bundle build.
  tauri-check:
    name: tauri shell check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates
            src-tauri

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev

      - name: Install OpenSSL (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows-static-md
          echo "OPENSSL_DIR=C:\vcpkg\installed\x64-windows-static-md" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV
          $libs = "-Clink-arg=advapi32.lib -Clink-arg=user32.lib -Clink-arg=crypt32.lib -Clink-arg=gdi32.lib"
          echo "RUSTFLAGS=$libs" >> $env:GITHUB_ENV

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install pnpm
        run: npm install -g pnpm

      # tauri.conf.json declares `"resources": ["bin/coordinator*"]`, and
      # tauri-build hard-fails when that glob matches nothing. The sidecar is
      # gitignored and only exists after a bun --compile, so produce it here
      # (release.yml does the same before bundling). The vendored core-*
      # engines must be built first — bun resolves them via their `main`
      # (dist/index.js).
      - name: Build coordinator sidecar (tauri resource glob)
        # GITHUB_WORKSPACE is the repo root (the tauri-check job's default
        # working-directory is src-tauri, so override back to the root).
        working-directory: .
        shell: bash
        run: |
          pnpm install
          pnpm --filter './packages/core-*' run build
          mkdir -p packages/coordinator/dist
          pnpm --filter @agentcowork/coordinator build
          mkdir -p src-tauri/bin
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp packages/coordinator/dist/coordinator.exe src-tauri/bin/coordinator.exe
          else
            cp packages/coordinator/dist/coordinator src-tauri/bin/coordinator
          fi

      - name: cargo check (tauri shell)
        run: cargo check

      - name: cargo test --lib (tauri shell)
        run: cargo test --lib
