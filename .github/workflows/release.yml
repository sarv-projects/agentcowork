# AgentCowork — release build matrix (P8.8; P70.A1/A6/B7 platform scope).
#
# v1 ships **Windows only** (`SUPPORT-MATRIX.md` §1): `.exe` (NSIS) + `.msi`
# (WiX) for x64 **and** arm64. macOS and native Linux desktop are out of v1
# scope — the matrix below deliberately contains no macOS/Linux legs, and a
# tag therefore publishes nothing for them (returning one to scope is a
# `SUPPORT-MATRIX.md` change plus an acceptance pass, not a matrix edit).
#
# Triggered ONLY by a version tag (`v*`) or explicit manual dispatch — every
# published artifact is CI-produced from a tagged commit (P70.A6); hand-built
# binaries are never published. The run records the source commit and the
# toolchain versions into the release body (P70.A6 provenance).
#
# Required repo secrets (without them the workflow fails honestly — updater
# artifacts cannot be signed without the private key):
#   TAURI_SIGNING_PRIVATE_KEY         — the minisign private key in base64
#                                       (the same one .tauri/ holds locally;
#                                       base64 -d the .key file if re-adding)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — the key's passphrase ('' if none)
#   (the @agentcowork/core-* coordinator deps are vendored in-repo under
#    packages/core-* — no private-repo token is required anymore).
#
# The sidecar (packages/coordinator) is compiled with bun and shipped inside
# the bundle as a resource (`bin/coordinator.exe`), injected at build time via
# TAURI_CONFIG so local `tauri build` (without the sidecar) keeps working.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fix 3 — the v1 kernel gate: releases are blocked while security-kernel
  # items (P48.2/P48.4/P47.5) are open. The doc-sync check fails (exit 1) when
  # any gate item is open; this job gates the whole build matrix on it.
  kernel-gate:
    name: kernel gate (v1 blockers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run doc-sync + kernel-gate check
        run: node scripts/check-doc-sync.mjs

  # P70.E2/E4 — the release commit must carry green suites and a passing
  # security gate. A tag that cannot qualify is not packaged (P70 sequencing
  # rule: nothing in P70.A–D ships while a release-blocking gate is open).
  qualification:
    name: qualification gates (suites + security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - name: Rust workspace tests
        run: cargo test --workspace
        working-directory: crates
      - name: Install JS workspace dependencies
        run: |
          npm install -g pnpm bun
          pnpm install
      - name: UI tests
        run: (cd ui && bun test)
      - name: Vendored core-* + coordinator tests
        run: |
          pnpm --filter './packages/core-*' run build
          pnpm --filter './packages/core-*' run test
          pnpm --filter @agentcowork/coordinator test
      - name: Security release gate (P50.5.7)
        run: node scripts/e2e/security-gate.mjs
      # P70.E12 is a publication gate, not a report. `--record` makes any
      # RUNNABLE or BLOCKED item fail this job; it must not be replaced with a
      # report-only invocation that exits zero.
      - name: Release qualification sign-off (P70.E12; fail closed)
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "P70.E12: requiring every release-qualification item to be PASS for $VERSION"
          node scripts/release-qualify.mjs --record "$VERSION"

  build:
    name: windows ${{ matrix.target }} (NSIS + MSI)
    needs: [kernel-gate, qualification]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            vcpkg_triplet: x64-windows-static-md
            openssl_dir: C:\vcpkg\installed\x64-windows-static-md
            name: windows x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            vcpkg_triplet: arm64-windows-static-md
            openssl_dir: C:\vcpkg\installed\arm64-windows-static-md
            name: windows arm64
    runs-on: ${{ matrix.os }}
    # N.B. the repo is checked out to `desktop_app/` and every `run:` step
    # below starts there, so run-step paths are REPO-RELATIVE (`src-tauri/…`).
    # Step inputs that resolve against $GITHUB_WORKSPACE instead (setup-node's
    # `cache-dependency-path`) keep the `desktop_app/` prefix.
    defaults:
      run:
        working-directory: desktop_app
    steps:
      - uses: actions/checkout@v4
        with:
          path: desktop_app

      - name: Install Rust toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # rust-cache resolves these against the job's working directory
          # (`desktop_app/` = the repo root), so they are repo-relative.
          workspaces: crates, src-tauri

      - name: Verify Rust target toolchain (${{ matrix.target }})
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $target = "${{ matrix.target }}"
          $installed = @(rustup target list --installed)
          if ($installed -notcontains $target) {
            throw "Rust target '$target' is not installed; refusing to build this release leg."
          }
          $probeSource = Join-Path $env:RUNNER_TEMP "agentcowork-target-probe.rs"
          $probeBinary = Join-Path $env:RUNNER_TEMP "agentcowork-target-probe.exe"
          Set-Content -LiteralPath $probeSource -Value "fn main() {}"
          & rustc --target $target $probeSource -o $probeBinary
          if ($LASTEXITCODE -ne 0) {
            throw "The Windows runner cannot link Rust target '$target'; refusing to publish this release leg."
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop_app/ui/package-lock.json

      - name: Install OpenSSL (${{ matrix.vcpkg_triplet }})
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $target = "${{ matrix.target }}"
          $triplet = "${{ matrix.vcpkg_triplet }}"
          $opensslDir = "${{ matrix.openssl_dir }}"
          $expectedTriplet = switch ($target) {
            "x86_64-pc-windows-msvc" { "x64-windows-static-md" }
            "aarch64-pc-windows-msvc" { "arm64-windows-static-md" }
            default { throw "Unsupported Windows target '$target'; refusing to select an OpenSSL triplet." }
          }
          if ($triplet -ne $expectedTriplet) {
            throw "Target '$target' requires vcpkg triplet '$expectedTriplet', not '$triplet'."
          }
          if ((Split-Path -Leaf $opensslDir) -ne $expectedTriplet) {
            throw "OPENSSL_DIR '$opensslDir' does not match the target triplet '$expectedTriplet'."
          }
          if (-not (Get-Command vcpkg -ErrorAction SilentlyContinue)) {
            throw "vcpkg is required to install OpenSSL for '$target'."
          }
          & vcpkg install "openssl:$triplet"
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg could not install openssl:$triplet for '$target'."
          }
          if (-not (Test-Path -LiteralPath $opensslDir)) {
            throw "OpenSSL for '$target' was not installed at '$opensslDir'."
          }
          "VCPKG_TARGET_TRIPLET=$triplet" >> $env:GITHUB_ENV
          "OPENSSL_DIR=$opensslDir" >> $env:GITHUB_ENV
          "OPENSSL_STATIC=1" >> $env:GITHUB_ENV
          $libs = "-Clink-arg=advapi32.lib -Clink-arg=user32.lib -Clink-arg=crypt32.lib -Clink-arg=gdi32.lib"
          "RUSTFLAGS=$libs" >> $env:GITHUB_ENV

      - name: Setup bun + pnpm
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install pnpm
        run: npm install -g pnpm

      # P70.B1 — Authenticode code signing. The certificate itself cannot live
      # in the repo; it arrives as the WINDOWS_CERTIFICATE (PFX, base64) and
      # WINDOWS_CERTIFICATE_PASSWORD secrets. This step FAILS the job when
      # either is absent — a lapsed/missing certificate must stop the release,
      # never quietly produce an unsigned installer (B1's stated failure mode).
      # signtool (Windows SDK) signs every produced executable + installer with
      # an RFC-3161 trusted timestamp; the tauri-action step below then bundles
      # the already-signed binaries.
      - name: Require the Authenticode certificate (P70.B1)
        shell: bash
        run: |
          if [ -z "${WINDOWS_CERTIFICATE:-}" ] || [ -z "${WINDOWS_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::error::P70.B1 — WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD secrets are not set on this repository."
            echo "::error::Refusing to produce an UNSIGNED release: Authenticode-sign every executable and installer, or fix the certificate (custody/renewal: docs/signing.md)."
            exit 1
          fi
          echo "P70.B1: Authenticode certificate secrets present"
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Decode + install the certificate into the user store (P70.B1)
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pwd = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $imported = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
          if (-not $imported -or $imported.Count -eq 0) { throw "P70.B1: the Authenticode certificate could not be imported" }
          $code = $imported | Where-Object { $_.HasPrivateKey }
          if (-not $code) { throw "P70.B1: imported certificate has no private key" }
          $thumb = ($code | Select-Object -First 1).Thumbprint
          echo "CODESIGN_THUMBPRINT=$thumb" >> $env:GITHUB_ENV
          Remove-Item -Force $pfxPath
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Install workspace deps
        run: |
          pnpm install
          (cd ui && npm ci)

      - name: Build vendored core-* packages
        run: pnpm --filter './packages/core-*' run build

      - name: Build coordinator sidecar (bun --compile)
        run: pnpm --filter @agentcowork/coordinator build

      # Inject the compiled sidecar into the bundle as a resource
      # (`bin/coordinator.exe`) via TAURI_CONFIG. The shell's
      # `locate_coordinator_bin` probes the resource dir first, so the
      # packaged app spawns the sidecar from the bundle — no external path.
      - name: Inject sidecar as bundle resource
        shell: bash
        run: |
          SRC="packages/coordinator/dist/coordinator.exe"
          DST="bin/coordinator.exe"
          echo "TAURI_CONFIG={\"bundle\":{\"resources\":{\"$SRC\":\"$DST\"}}}" >> $GITHUB_ENV

      - name: Tauri build (${{ matrix.target }}) + publish to GitHub release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # P70.B1 — tauri-bundler signs the bundle's executables with signtool
          # when it finds the certificate in the user store (thumbprint above).
          # The timestamp server makes the signatures valid beyond certificate
          # expiry (a lapsed certificate must not invalidate past releases).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Updater signing: only the release-private key can sign artifacts.
          args: --target ${{ matrix.target }} --bundles nsis,msi
          tagName: v__VERSION__
          releaseName: 'AgentCowork v__VERSION__'
          releaseBody: |
            **AgentCowork v__VERSION__** — local-first, BYOK, on-device agentic workspace.

            **Platform scope (v1):** Windows x64 + arm64 only (`SUPPORT-MATRIX.md`).
            No macOS or Linux artifact is published — see the support matrix for
            what is supported and what is explicitly not claimed.

            Installers + the auto-updater manifest are attached to this release.
            The updater signs with the release private key
            (TAURI_SIGNING_PRIVATE_KEY); verify the pubkey in
            `src-tauri/tauri.conf.json` before trusting an update.

            ---
            **Build provenance (P70.A6)**
            - Source commit: ${{ github.sha }}
            - Rust: stable (${{ matrix.target }})
            - Node 22 · Bun latest · pnpm latest
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          releaseDraft: true
          prerelease: false

      # P70.A5 — the produced installer and the installed footprint are measured
      # against the recorded budgets; a release that breaks its size/footprint
      # budget fails here rather than shipping and being noticed later.
      - name: Size + footprint budget (P70.A5)
        shell: bash
        run: node scripts/check-size-budget.mjs --bundle "src-tauri/target/${{ matrix.target }}/release/bundle" --target ${{ matrix.target }}

      # P70.B7 — the artifact-leak gate runs on the PRODUCED bundle, not just
      # the source tree: no key material, .env, dev database, or signing key
      # may ever ship inside an installer. Scans the whole bundle directory
      # the tauri-action produced (installer + updater artifacts + manifest).
      - name: Secret-leak gate on produced artifacts (P70.B7)
        shell: bash
        run: node scripts/check-artifact-hygiene.mjs --paths "src-tauri/target/*/release/bundle"

      # P70.B5 — a software bill of materials (CycloneDX) covering the Rust
      # workspace, the shell, the UI and the coordinator, plus a build-provenance
      # attestation, attached to the release so a consumer can verify what was
      # built, from which commit, by which pipeline. Generated from the lockfiles
      # (deterministic, offline); a missing SBOM fails the job.
      - name: Generate SBOM + provenance attestation (P70.B5)
        shell: bash
        run: node scripts/gen-sbom.mjs --out dist-sbom --commit "$GITHUB_SHA" --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Attach SBOM + provenance to the release (P70.B5)
        shell: bash
        run: |
          cd dist-sbom
          for f in *; do
            gh release upload "v$(node -p "require('../src-tauri/tauri.conf.json').version")" "$f" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # P70.F1/F2/F4 — the derived half of the release surface, generated from
      # the artifacts this job just produced and the single version authority:
      # SHA256SUMS over every artifact, machine-readable release notes assembled
      # from the changelog entry, and the winget manifests for the package-
      # manager route. All three are attached; a missing artifact fails the job
      # because the generator refuses to hash an empty directory.
      - name: Generate release surface — checksums, notes, winget (P70.F1/F2/F4)
        shell: bash
        run: |
          node scripts/gen-release-surface.mjs \
            --artifacts "src-tauri/target/${{ matrix.target }}/release/bundle" \
            --out dist-release

      - name: Attach checksums, release notes and winget manifests (P70.F1/F2/F4)
        shell: bash
        run: |
          cd dist-release
          TAG="v$(node -p "require('../src-tauri/tauri.conf.json').version")"
          for f in *; do
            gh release upload "$TAG" "$f" --clobber
          done
          cd ../packaging/winget
          for f in *.yaml; do
            gh release upload "$TAG" "$f" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # P70.F2 — the winget manifests must name the version that shipped.
      # (P70.F3 retired 2026-09-26: docs/download.md archived with the v0 corpus.)
      - name: Public surface agreement (P70.F2/F5/F6/F8)
        shell: bash
        run: |
          node scripts/gen-release-surface.mjs --check
          node scripts/check-public-surface.mjs
