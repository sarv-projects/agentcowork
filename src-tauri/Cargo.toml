[package]
name = "agentcowork-desktop"
version = "0.1.0"
description = "AgentCowork — agentic desktop OS shell (Tauri v2)"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[lib]
name = "agentcowork_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# P70.C2 — the channel-aware updater builds endpoint URLs from strings.
url = "2"
# P70.C4 — the periodic update-check loop shares the runtime the plugin uses.
tokio = { version = "1", features = ["time"] }
# P63 — scrub the raw provider key the moment an agent's spawn env is built
# (`agent_backend_cmds`). The vault already zeroizes internally; this keeps
# the shell's own copy of the value from lingering in the heap.
zeroize = "1"

# AgentCowork Rust core — path deps into the crates workspace. The core owns
# config, vault, guard, audit and IPC; the shell just exposes it to the UI.
agentcowork-core = { path = "../crates/agentcowork-core" }
agentcowork-ipc = { path = "../crates/agentcowork-ipc" }
agentcowork-vault = { path = "../crates/agentcowork-vault" }
agentcowork-audit = { path = "../crates/agentcowork-audit" }
agentcowork-guard = { path = "../crates/agentcowork-guard" }
agentcowork-office = { path = "../crates/agentcowork-office" }
agentcowork-catalog = { path = "../crates/agentcowork-catalog" }
agentcowork-acp = { path = "../crates/agentcowork-acp" }
agentcowork-mcp = { path = "../crates/agentcowork-mcp" }
agentcowork-storage = { path = "../crates/agentcowork-storage" }
agentcowork-browser = { path = "../crates/agentcowork-browser" }
agentcowork-cdp = { path = "../crates/agentcowork-cdp" }
agentcowork-codeintel = { path = "../crates/agentcowork-codeintel" }
agentcowork-agents = { path = "../crates/agentcowork-agents" }
# P69.D1/D25 — the canonical agent/element schema lives in `agentcowork-types`;
# the shell reads the same record shape the crates and the TS façade use.
agentcowork-types = { path = "../crates/agentcowork-types" }
agentcowork-blueprint = { path = "../crates/agentcowork-blueprint" }
agentcowork-script = { path = "../crates/agentcowork-script" }
agentcowork-computeruse = { path = "../crates/agentcowork-desktop", package = "agentcowork-computeruse" }

[dev-dependencies]
# P70.D8 — diagnostics_cmds tests write a temp audit ledger.
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
