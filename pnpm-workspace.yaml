# AgentCowork desktop workspace (P0.3 task 19).
# `packages/*` = all desktop packages: the coordinator, ui, AND the vendored
# `@agentcowork/core-*` engine packages (copied in from the reference APP repo
# so this repo is fully self-contained — no `../APP` sibling required).
packages:
  - "packages/*"
  - "ui"

# Native deps pulled in via @agentcowork/core-* — allow their build scripts
# (better-sqlite3, onnxruntime-node, etc. are required by the engine).
# pnpm 11 syntax: map of package → true (renamed from onlyBuiltDependencies).
allowBuilds:
  better-sqlite3: true
  esbuild: true
  onnxruntime-node: true
  workerd: true

minimumReleaseAgeExclude:
  - dompurify@3.4.16

# Force one React types version across the workspace so the ui program sees a
# single React type identity (mixing @types/react@18 and @19 breaks tsc in the
# shadcn components).
overrides:
  "@types/react": "^19.0.0"
  "@types/react-dom": "^19.0.0"
  dompurify: "3.4.16"
