[workspace]
resolver = "2"
members = [
    "agentcowork-core",
    "agentcowork-ipc",
    "agentcowork-guard",
    "agentcowork-audit",
    "agentcowork-vault",
    "agentcowork-cdp",
    "agentcowork-browser",
    "agentcowork-script",
    "agentcowork-mcp",
    "agentcowork-office",
    "agentcowork-storage",
    "agentcowork-memory",
    "agentcowork-eval",
    "agentcowork-blueprint",
    "agentcowork-codeintel",
    "agentcowork-acp",
    "agentcowork-agents",
    "agentcowork-search",
    "agentcowork-catalog",
    "agentcowork-desktop",
    "agentcowork-types",
]

# N.B. crates/agentcowork-desktop has package name agentcowork-computeruse (renamed
# to disambiguate from the src-tauri shell package, which is also
# agentcowork-desktop). The [workspace.dependencies] section below does not list
# it as a shared dep — src-tauri declares it directly with a :rename.

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }
toml = "0.8"
ureq = { version = "2", features = ["tls", "json"] }
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
opentelemetry = "0.27"
sha2 = "0.10"
argon2 = "0.5"
sha1 = "0.10"
base64 = "0.22"
urlencoding = "2"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
url = "2"
zip = "2"
similar = "2"
roxmltree = "0.20"
flate2 = "1"
crc32fast = "1"
tar = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
