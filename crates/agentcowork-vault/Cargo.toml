[package]
name = "agentcowork-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "AgentCowork vault — SQLCipher key-ring store (P0.1 init; P1.1 key pools, routing, budgets + credential broker)"

[dependencies]
rusqlite = { workspace = true }
# DEC-053 — the one `AGENTCOWORK_*`/legacy-`EVERYAIOS_*` env + data-home rule.
agentcowork-types = { path = "../agentcowork-types" }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# FIX-09: the oauth transport is a custody path, so its destinations are
# floored by the one implementation in `agentcowork-guard::netfloor` rather than
# a private copy. Direction is Trust → vault (guard does not depend on the
# vault), so this adds no cycle; `check-arch-invariants` has no rule against it.
agentcowork-guard = { path = "../agentcowork-guard" }
ureq = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
