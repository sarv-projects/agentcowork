# AgentCowork headless executor node — docker compose (P40.1, OpenClaw-style
# container-first deployment; pattern only, we ship our own signed runtime).
#
# Usage:
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# The node attaches to your mesh (P8.9) — set the sync token via the vault
# key env (or mount a pre-created data-home volume with the node's
# identity). Guard-2-required steps park on the node and surface on the
# control plane; they are never auto-approved here.
services:
  agentcowork-node:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: agentcowork-node:local
    container_name: agentcowork-node
    restart: unless-stopped
    environment:
      # New data-home first, legacy fallback alongside: the current binary
      # still reads EVERYAIOS_HOME (DEC-053 migration is Core-owned).
      AGENTCOWORK_HOME: /data
      EVERYAIOS_HOME: /data
      # SQLCipher vault key — the node's identity + mesh key material. Set via
      # a secret / .env file; NEVER hardcode or commit it. Either spelling is
      # passed through; the binary reads the legacy name until Core lands
      # DEC-053, and the fail-fast survives on both.
      AGENTCOWORK_VAULT_KEY: ${AGENTCOWORK_VAULT_KEY:-${EVERYAIOS_VAULT_KEY:?set this in deploy/.env}}
      EVERYAIOS_VAULT_KEY: ${EVERYAIOS_VAULT_KEY:-${AGENTCOWORK_VAULT_KEY:?set this in deploy/.env}}
    volumes:
      - agentcowork-data:/data
    ports:
      # P8.9 E2E sync — the encrypted mesh transport (LAN/Tailscale/WireGuard).
      - "47615:47615/tcp"
    networks:
      - agentcowork-mesh
    healthcheck:
      test: ["CMD", "/app/agentcowork-core", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  agentcowork-data:

networks:
  agentcowork-mesh:
    driver: bridge
